# Reference configuration for serving the built app from any static host.
# Mirrors public/_headers and public/_redirects.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Hashed filenames: safe to cache forever.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~ ^/(images|social|icons)/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
  }

  # Single-page app: unknown paths are routes, not missing files.
  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
