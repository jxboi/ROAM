version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps CI cheap and the changes reviewable together.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router-dom']
      tooling:
        patterns: ['vite', '@vitejs/*', 'vitest', '@vitest/*', 'typescript', 'typescript-eslint', 'eslint', 'eslint-*', '@eslint/*']
      testing:
        patterns: ['@playwright/*', '@axe-core/*', '@testing-library/*', 'jsdom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
